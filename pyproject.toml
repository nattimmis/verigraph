[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verigraph"
version = "0.1.0"
description = "A code knowledge graph where every edge is correctness-graded (TRUE/UNKNOWN/FALSE), not just extracted."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nathaniel Timmis", email = "nattimmis@gmail.com" }]
keywords = ["knowledge-graph", "code-analysis", "ast", "verification", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# Optional JS/TS extraction. VeriGraph degrades gracefully if this is absent.
js = ["tree-sitter>=0.21", "tree-sitter-javascript>=0.21"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/nattimmis/verigraph"
Repository = "https://github.com/nattimmis/verigraph"
Issues = "https://github.com/nattimmis/verigraph/issues"

[project.scripts]
verigraph = "verigraph.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["verigraph"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The fixture deliberately contains an undefined symbol and an unused import
# so VeriGraph has something to grade FALSE/UNKNOWN; don't lint it.
extend-exclude = ["tests/fixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
